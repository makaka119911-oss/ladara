<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:type" content="website">
<meta property="og:site_name" content="LADARA">
<meta property="og:title" content="LADARA — сайты, приложения и боты">
<meta property="og:description" content="Собираю сайты, приложения и чат-боты сам, без конструкторов. Работы можно рассмотреть вблизи — как в музее.">
<meta property="og:locale" content="ru_RU">
<meta property="og:url" content="https://makaka119911-oss.github.io/ladara/">
<meta property="og:image" content="https://makaka119911-oss.github.io/ladara/img/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="LADARA — сайты, приложения и боты">
<meta name="twitter:description" content="Собираю сайты, приложения и чат-боты сам, без конструкторов. Работы можно рассмотреть вблизи — как в музее.">
<meta name="twitter:image" content="https://makaka119911-oss.github.io/ladara/img/og-card.jpg">
<meta property="og:image:alt" content="Тёмный музейный зал: человек перед большой картиной в золотой раме, тёплый свет свечей">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero-phone.jpg" media="(max-width:767px)">
<link rel="preload" as="image" href="img/hero-desk.jpg" media="(min-width:768px)">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<a class="brand" href="#top">LADARA</a>
<div class="rail" aria-hidden="true"><i id="railFill"></i></div>
<div class="counter"><b id="hallNum">Обложка</b><span id="hallTotal"></span></div>
<nav class="plan" id="plan" aria-label="План залов"></nav>

<!-- ОБЛОЖКА -->
<header class="cover" id="top">
  <div class="cover__media">
    <picture>
      <source media="(min-width:768px)" srcset="img/hero-desk.jpg">
      <img src="img/hero-phone.jpg" alt="Тёмный зал музея: человек смотрит на светящееся полотно" fetchpriority="high">
    </picture>
  </div>
  <div class="cover__inner">
    <div class="cover__lead">
      <p class="eyebrow" id="coverKicker">Каталог работ</p>
      <h1 id="coverTitle">Сайты, приложения,<br>боты</h1>
      <p class="cover__offer" id="coverOffer"></p>
      <a class="cta" href="#exp" id="coverCta">Смотреть экспозицию</a>
    </div>
    <!-- перечень работ: виден сразу, без прокрутки -->
    <nav class="index" id="coverIndex" aria-label="Работы"></nav>
  </div>
</header>

<!-- РАЗВОРОТЫ: рисуются из data.js -->
<main id="spreads"></main>

<noscript>
  <section class="spread"><p class="label__title">Экспонаты: Семь ремёсел · Сексология и психология · Женский мир</p></section>
</noscript>

<!-- ПЕЧАТНЫЕ РАБОТЫ -->
<section class="posters" id="posters">
  <div class="posters__inner">
    <p class="eyebrow rv" id="postersKicker" style="--rv-d:0ms"></p>
    <h2 class="rv" id="postersTitle" style="--rv-d:60ms"></h2>
    <p class="posters__lead rv" id="postersLead" style="--rv-d:120ms"></p>
    <div class="posters__wall" id="postersWall"></div>
    <div id="posterLeaflet"></div>
  </div>
</section>

<!-- МАСТЕР -->
<section class="about" id="about">
  <div class="about__inner">
    <figure class="about__photo rv" style="--rv-d:0ms">
      <img id="authorPhoto" src="img/autor.webp?v=2" alt="Портрет автора" loading="lazy">
    </figure>
    <div class="about__text rv" style="--rv-d:120ms">
      <p class="eyebrow" id="aboutKicker">Смотритель</p>
      <h2 id="aboutTitle">Об авторе</h2>
      <div id="aboutBody"></div>
      <figure class="about__workshop rv" style="--rv-d:200ms">
        <img id="authorWorkshop" src="img/about-workshop.webp?v=2" alt="Рабочий стол в мастерской" loading="lazy">
      </figure>
    </div>
  </div>
</section>

<!-- КОЛОФОН -->
<footer class="colophon" id="contact">
  <div class="colophon__media"><img src="img/outro.jpg" alt="Пустой зал музея с тёплым светом" loading="lazy"></div>
  <div class="colophon__inner rv">
    <p class="eyebrow" id="outroKicker">Конец экспозиции</p>
    <h2 id="outroTitle">Нужно похожее?</h2>
    <p class="colophon__lead" id="outroText"></p>

    <div class="colophon__cols rv" style="--rv-d:160ms">
      <div>
        <p class="colophon__k">Связаться</p>
        <p><a class="cta" href="https://t.me/LADAR888" target="_blank" rel="noopener" id="contactTg">@LADAR888</a></p>
        <p><a class="cta" href="mailto:makaka119911@gmail.com" id="contactMail">makaka119911@gmail.com</a></p>
      </div>
      <div>
        <p class="colophon__k">Студия</p>
        <p class="colophon__v">LADARA</p>
        <p class="colophon__v" id="colophonYear"></p>
      </div>
      <div>
        <p class="colophon__k">Экспонатов</p>
        <p class="colophon__v" id="colophonCount"></p>
      </div>
    </div>
    <p class="colophon__note" id="outroNote"></p>
  </div>
</footer>

<!-- РАССМАТРИВАНИЕ -->
<div class="viewer" id="viewer" hidden>
  <button class="viewer__close" id="viewerClose" aria-label="Закрыть">✕</button>
  <button class="viewer__nav viewer__nav--prev" id="viewerPrev" aria-label="Предыдущий">‹</button>
  <button class="viewer__nav viewer__nav--next" id="viewerNext" aria-label="Следующий">›</button>
  <div class="viewer__stage" id="viewerStage">
    <div class="viewer__art" id="viewerArt"></div>
  </div>
  <div class="viewer__foot">
    <p class="viewer__caption" id="viewerCaption"></p>
    <div class="viewer__info" id="viewerInfo"></div>
    <p class="viewer__hint" id="viewerHint"></p>
  </div>
</div>

<script src="data.js?v=7"></script>
<script src="script.js?v=11"></script>
</body>
</html>
